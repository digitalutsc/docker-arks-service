name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Weekly, so a base image or dependency that has gone stale or picked up a
  # known vulnerability is noticed even when nobody is committing.
  schedule:
    - cron: "17 9 * * 1"

# The stack builds the application from a checkout of digitalutsc/arks-service
# placed beside this one, where `make env` finds it as ../arks-service, exactly
# as on a workstation. The plugin leg also checks out digitalutsc/arks-cli
# beside it. Both repositories are private: give this one a read-only token for
# them as the secret ARKS_SERVICE_TOKEN (a fine-grained token with Contents:
# read on arks-service and arks-cli). The two refs below pick their branches.
env:
  ARKS_SERVICE_REF: main
  ARKS_CLI_REF: main

jobs:
  static:
    # Everything that needs no image: the scripts, every Compose combination
    # .env.example offers, and the .env bootstrap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts
        run: shellcheck scripts/*.sh

      - name: Every Compose combination parses
        # The combinations are read from .env.example, so a file added there is
        # checked without touching this workflow. Compose interpolates required
        # values even for `config`; these are placeholders, nothing connects.
        env:
          DJANGO_SECRET_KEY: placeholder-for-compose-config
          MYSQL_HOST: placeholder.invalid
          MYSQL_PASSWORD: placeholder
          BROKER_HOST: placeholder.invalid
          ARKS_BIND_ADDRESS: 127.0.0.1
        run: |
          docker compose version
          combos=$(printf 'docker-compose.yml\n'; sed -n 's/^#COMPOSE_FILE=//p' .env.example)
          test "$(printf '%s\n' "$combos" | wc -l)" -ge 5
          for files in $combos; do
            echo "== $files"
            COMPOSE_FILE=$files docker compose config -q
          done

      - name: make env creates .env once and never rewrites it
        run: |
          make env
          test "$(stat -c %a .env)" = 600
          grep -qx 'ARKS_SRC=./src/arks-service' .env
          for key in DJANGO_SECRET_KEY DJANGO_SUPERUSER_PASSWORD BROKER_PASSWORD; do
            value=$(sed -n "s/^$key=//p" .env)
            test "${#value}" -ge 32 || { echo "::error::$key was not generated"; exit 1; }
          done
          before=$(sha256sum .env)
          make env
          test "$(sha256sum .env)" = "$before" || { echo "::error::a second make env changed .env"; exit 1; }

  smoke:
    # Builds the image and brings the whole stack up with `make up`, as an
    # operator would, then checks it serves. Two legs: the development default
    # (PostgreSQL, no plugin), and the production engine with the arks-cli
    # plugin built in and operator fallback pages mounted.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: postgres
            compose_file: ""
            plugin: false
          - leg: mysql + arks-cli
            compose_file: docker-compose.yml:docker-compose.mysql.yml
            plugin: true
    name: smoke (${{ matrix.leg }})
    defaults:
      run:
        working-directory: docker-arks-service

    steps:
      - uses: actions/checkout@v4
        with:
          path: docker-arks-service

      - name: Check the token for the application repositories
        env:
          TOKEN: ${{ secrets.ARKS_SERVICE_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo "::error::Set the secret ARKS_SERVICE_TOKEN: a read-only token for digitalutsc/arks-service and digitalutsc/arks-cli."
            exit 1
          }

      - name: Check out arks-service beside it
        uses: actions/checkout@v4
        with:
          repository: digitalutsc/arks-service
          ref: ${{ env.ARKS_SERVICE_REF }}
          token: ${{ secrets.ARKS_SERVICE_TOKEN }}
          path: arks-service

      - name: Check out arks-cli beside it
        if: matrix.plugin
        uses: actions/checkout@v4
        with:
          repository: digitalutsc/arks-cli
          ref: ${{ env.ARKS_CLI_REF }}
          token: ${{ secrets.ARKS_SERVICE_TOKEN }}
          path: arks-cli

      - name: Write .env
        env:
          COMPOSE_FILE_LINE: ${{ matrix.compose_file }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          make env
          grep -qx 'ARKS_SRC=../arks-service' .env
          if [ -n "$COMPOSE_FILE_LINE" ]; then
            echo "COMPOSE_FILE=$COMPOSE_FILE_LINE" >> .env
          fi
          if [ "$PLUGIN" = true ]; then
            {
              echo "ARKS_PLUGIN_SRC=../arks-cli"
              echo "ARKS_PLUGINS=arks_cli"
              echo "FALLBACK_DIR=../arks-service/docs/fallback-example"
            } >> .env
          fi

      - name: make up
        run: make up

      - name: The stack serves
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:8000/admin/login/
          # An unknown NAAN is a 404, never a redirect elsewhere.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ark:/99999/nothing)
          test "$code" = 404 || { echo "::error::unknown ARK answered $code"; exit 1; }

      - name: make up created the administrator
        run: |
          docker compose exec -T web python manage.py shell -c "
          from django.contrib.auth import get_user_model
          assert get_user_model().objects.filter(username='admin', is_superuser=True).exists()
          "

      - name: The worker and the scheduler answer through the broker
        run: |
          docker compose exec -T worker celery -A arkservice inspect ping --timeout 10 | tee ping.txt
          grep -q '2 nodes online' ping.txt

      - name: Without the plugin, its commands are absent
        if: ${{ !matrix.plugin }}
        run: |
          if docker compose exec -T web python manage.py mint ci 1 2> err.txt; then
            echo "::error::mint ran although no plugin was built in"; exit 1
          fi
          grep -q "Unknown command" err.txt

      - name: With the plugin, mint, bind and resolve
        if: matrix.plugin
        run: |
          manage() { docker compose exec -T web python manage.py "$@"; }
          manage createcollection "CI collection" --prefix ci --naan 99999 --naa "CI" --template .zd
          manage mint ci 1 > minted.txt
          ark=$(head -1 minted.txt)
          echo "minted $ark"
          manage bind "$ark" URL https://example.org/ci
          got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:8000/ark:/$ark")
          test "$got" = "302 https://example.org/ci" || { echo "::error::resolver answered: $got"; exit 1; }
          curl -fsS "http://localhost:8000/ark:/$ark?info" > info.txt
          grep -q '^erc:' info.txt
          manage flush_counters
          manage ark_stats

      - name: The mounted fallback pages are served, placeholders filled in
        if: matrix.plugin
        run: |
          curl -fsS http://localhost:8000/ > landing.html
          grep -q 'Persistent identifiers' landing.html
          if grep -q '{{' landing.html; then
            echo "::error::the landing page still has a placeholder in it"; exit 1
          fi
          curl -fsS -o /dev/null http://localhost:8000/fallback/style.css

      - name: Without FALLBACK_DIR, no fallback pages are served
        if: ${{ !matrix.plugin }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/fallback/style.css)
          test "$code" = 404 || { echo "::error::/fallback/style.css answered $code"; exit 1; }

      - name: A second make up changes nothing
        run: |
          before=$(sha256sum .env)
          make up
          test "$(sha256sum .env)" = "$before"

      - name: Logs
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 300 || true

      - name: make clean
        if: always()
        run: |
          make clean
          # The throwaway key lets Compose run even if .env was never written.
          test -z "$(DJANGO_SECRET_KEY=unused docker compose ps -aq)"

  production:
    # The production shape, started for real: an existing MySQL server reached
    # over TLS (docker-compose.external-db.yml) and a proxy on another machine
    # (docker-compose.remote-proxy.yml). A MySQL container published on the
    # runner's own address stands in for the external server; it is not part
    # of the stack, exactly as in production. This is also where the container
    # hardening, the Celery health checks, the access-log fields and the
    # rollback and backup targets are exercised.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: smoke (external MySQL + remote proxy)
    defaults:
      run:
        working-directory: docker-arks-service
    env:
      PUBLIC_HOST: ark.ci.example
      DB_PASSWORD: cionlypassword

    steps:
      - uses: actions/checkout@v4
        with:
          path: docker-arks-service

      - name: Check the token for the application repository
        env:
          TOKEN: ${{ secrets.ARKS_SERVICE_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo "::error::Set the secret ARKS_SERVICE_TOKEN: a read-only token for digitalutsc/arks-service and digitalutsc/arks-cli."
            exit 1
          }

      - name: Check out arks-service beside it
        uses: actions/checkout@v4
        with:
          repository: digitalutsc/arks-service
          ref: ${{ env.ARKS_SERVICE_REF }}
          token: ${{ secrets.ARKS_SERVICE_TOKEN }}
          path: arks-service

      - name: Start the stand-in for the external MySQL server
        run: |
          addr=$(hostname -I | awk '{print $1}')
          test -n "$addr"
          echo "ADDR=$addr" >> "$GITHUB_ENV"
          docker run -d --name ark-ci-mysql -p "$addr:3306:3306" \
            -e MYSQL_DATABASE=ark -e MYSQL_USER=ark \
            -e MYSQL_PASSWORD="$DB_PASSWORD" -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" \
            mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
          # Over TCP: while the image initialises it runs a temporary server
          # with networking off, so this only passes once the real one is up.
          for _ in $(seq 60); do
            if docker exec ark-ci-mysql mysqladmin ping -h 127.0.0.1 -uark -p"$DB_PASSWORD" --silent 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ark-ci-mysql | tail -50
          echo "::error::the MySQL stand-in did not come up"; exit 1

      - name: Write .env
        # Set in place where the template already has the key: a second line
        # for the same key would leave two readers to agree on which one wins.
        run: |
          make env
          set_env() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              echo "$1=$2" >> .env
            fi
          }
          set_env COMPOSE_FILE docker-compose.yml:docker-compose.external-db.yml:docker-compose.remote-proxy.yml
          set_env ARKS_BIND_ADDRESS "$ADDR"
          set_env ARKS_EXTRA_HOSTS "$PUBLIC_HOST"
          set_env TRUST_FORWARDED_FOR true
          set_env MYSQL_HOST "$ADDR"
          set_env MYSQL_PASSWORD "$DB_PASSWORD"
          set_env MYSQL_URL_OPTIONS '?ssl_mode=REQUIRED'
          grep -c '^MYSQL_HOST=' .env | grep -qx 1

      - name: make up
        run: make up

      - name: web answers on the bind address only
        run: |
          curl -fsS -H "Host: $PUBLIC_HOST" -H 'X-Forwarded-Proto: https' "http://$ADDR:8000/healthz"
          if curl -s -m 5 -o /dev/null http://127.0.0.1:8000/healthz; then
            echo "::error::web also answers on loopback: the port is not bound to ARKS_BIND_ADDRESS alone"; exit 1
          fi

      - name: The session and CSRF cookies are Secure
        run: |
          curl -fsS -D headers.txt -o /dev/null -H "Host: $PUBLIC_HOST" -H 'X-Forwarded-Proto: https' \
            "http://$ADDR:8000/admin/login/"
          grep -i '^set-cookie: csrftoken=' headers.txt | grep -qi '; *secure' || {
            cat headers.txt; echo "::error::the CSRF cookie is not marked Secure"; exit 1; }
          docker compose exec -T web python manage.py shell -c "
          from django.conf import settings
          assert settings.SESSION_COOKIE_SECURE and settings.CSRF_COOKIE_SECURE
          assert settings.TRUST_FORWARDED_FOR
          "

      - name: The connection to MySQL is encrypted
        run: |
          docker compose exec -T web python manage.py shell -c "
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(\"SHOW SESSION STATUS LIKE 'Ssl_cipher'\")
              cipher = cursor.fetchone()[1]
          print('cipher:', cipher)
          assert cipher, 'the session to MySQL is not encrypted'
          "

      - name: The application containers hold no capabilities
        run: |
          for service in web worker scheduler; do
            id=$(docker compose ps -q "$service")
            docker inspect -f '{{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}' "$id" | tee caps.txt
            grep -q 'ALL' caps.txt && grep -q 'no-new-privileges' caps.txt
            effective=$(docker compose exec -T "$service" sh -c "sed -n 's/^CapEff:[[:space:]]*//p' /proc/self/status")
            test "$effective" = 0000000000000000 || {
              echo "::error::$service runs with capabilities $effective"; exit 1; }
          done

      - name: The worker and the scheduler are healthy
        run: |
          for service in worker scheduler; do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$service")")
            test "$status" = healthy || { echo "::error::$service is $status"; exit 1; }
          done

      - name: The access log names the client
        run: |
          curl -s -o /dev/null -H "Host: $PUBLIC_HOST" -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-For: 203.0.113.9' -H 'X-Real-IP: 203.0.113.9' "http://$ADDR:8000/ark:/99999/nothing"
          sleep 2
          docker compose logs --no-color web | grep -q 'fwd=203.0.113.9 real=203.0.113.9' || {
            docker compose logs --no-color --tail 20 web
            echo "::error::the access log does not carry the forwarded address"; exit 1; }

      - name: make info gives the public address
        run: |
          make info | tee info.txt
          grep -q "https://$PUBLIC_HOST/admin/" info.txt
          grep -q "listens on $ADDR:8000" info.txt

      - name: make backup-media writes an archive
        run: |
          make backup-media
          archive=$(ls backups/media-*.tgz)
          tar tzf "$archive" > /dev/null
          test "$(stat -c %a "$archive")" = 600

      - name: make rollback swaps the images and comes back up
        run: |
          if make rollback; then
            echo "::error::rollback went ahead with no previous image"; exit 1
          fi
          # No second build here, so stand the current image in as the previous one.
          docker tag arkservice-web:local arkservice-web:prev
          make rollback
          curl -fsS -o /dev/null -H "Host: $PUBLIC_HOST" "http://$ADDR:8000/healthz"

      - name: Logs
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 300 || true
          docker logs ark-ci-mysql 2>&1 | tail -50 || true

      - name: make clean leaves the external database alone
        if: always()
        run: |
          make clean CONFIRM=yes
          test -z "$(DJANGO_SECRET_KEY=unused MYSQL_HOST=unused MYSQL_PASSWORD=unused ARKS_BIND_ADDRESS=127.0.0.1 docker compose ps -aq)"
          docker exec ark-ci-mysql mysql -uark -p"$DB_PASSWORD" ark -N -e 'SHOW TABLES' 2>/dev/null | grep -qx django_migrations
          docker rm -f ark-ci-mysql

  scan:
    # Builds the image as `make build` does (fresh base images, the locked
    # Python dependencies) and looks it up against known vulnerabilities in
    # its OS packages and Python packages. It fails only on High or Critical
    # ones that already have a fix, which a rebuild or a dependency bump
    # resolves; the full list is printed either way.
    #
    # Not on pull requests: what it finds comes from upstream, not from the
    # change under review, so it would turn unrelated pull requests red. It
    # runs on pushes to the default branch, weekly, and on demand.
    #
    # The action is pinned to a commit, with its release in the comment: a
    # scanner runs with the image and the workspace in reach, and a tag can be
    # moved.
    if: github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: scan (image vulnerabilities)
    defaults:
      run:
        working-directory: docker-arks-service

    steps:
      - uses: actions/checkout@v4
        with:
          path: docker-arks-service

      - name: Check the token for the application repository
        env:
          TOKEN: ${{ secrets.ARKS_SERVICE_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo "::error::Set the secret ARKS_SERVICE_TOKEN: a read-only token for digitalutsc/arks-service and digitalutsc/arks-cli."
            exit 1
          }

      - name: Check out arks-service beside it
        uses: actions/checkout@v4
        with:
          repository: digitalutsc/arks-service
          ref: ${{ env.ARKS_SERVICE_REF }}
          token: ${{ secrets.ARKS_SERVICE_TOKEN }}
          path: arks-service

      - name: make build
        run: make build

      - name: Scan arkservice-web:local
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: arkservice-web:local
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

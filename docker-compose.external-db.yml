# Opt-in override for production: run the stack against an existing MySQL
# server instead of a database container. Enable it by setting this in .env,
# which Compose (and therefore every make target) reads on its own:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.external-db.yml
#
# and filling in MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER and
# MYSQL_PASSWORD. The broker is chosen separately, with BROKER_IMAGE.
#
# This is an alternative to docker-compose.mysql.yml, not an addition to it:
# that file runs MySQL in a container, this one points at a server you already
# have. Development keeps using the container.
#
# What changes:
#   - db is never created or started. An override file cannot delete a
#     service, so it is parked in a profile nothing activates.
#   - web, worker and scheduler no longer wait for db. They still wait for
#     broker, and worker and scheduler still wait for web, which runs the
#     migrations. Only that one
#     dependency is reset, so this file combines with
#     docker-compose.external-broker.yml in either order.
#   - DATABASE_URL is built from the MYSQL_* values. web runs `migrate` on
#     every start, so the schema on that server is brought up to date by the
#     stack, exactly as `manage.py migrate` does in a bare deployment.
#
# The stack's health check (/healthz) proves the external server is reachable;
# `make up` reports the stack ready only once it is.
#
# MYSQL_HOST and MYSQL_PASSWORD have no default on purpose: a missing value
# stops Compose with a message instead of quietly looking for a host named db.
# The password goes into a URL, so use letters and digits, or percent-encode
# anything else (@ as %40, / as %2F, # as %23, % as %25).
#
# The !reset tags need Docker Compose 2.24.4 or later; `make check` says so.

services:
  db:
    profiles: ["local-db-disabled"]

  # The base file shares its environment through a YAML anchor, which is
  # expanded before the files are merged, so each service is overridden.
  web:
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ark}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@${MYSQL_HOST:?set MYSQL_HOST in .env to the MySQL server}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-ark}
    depends_on:
      db: !reset

  worker:
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ark}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@${MYSQL_HOST:?set MYSQL_HOST in .env to the MySQL server}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-ark}
    depends_on:
      db: !reset

  scheduler:
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ark}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@${MYSQL_HOST:?set MYSQL_HOST in .env to the MySQL server}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-ark}
    depends_on:
      db: !reset

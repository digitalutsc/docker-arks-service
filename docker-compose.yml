# The ARK service stack: gunicorn, two Celery processes (the worker for
# bulk-bind jobs, the scheduler for periodic tasks), Valkey and PostgreSQL.
# This file alone is the development default.
#
# Overrides, chosen with COMPOSE_FILE in .env (see README.md):
#   docker-compose.mysql.yml            MySQL 8.0 container instead of PostgreSQL
#   docker-compose.external-db.yml      production: an existing MySQL server, no db container
#   docker-compose.external-broker.yml  production: an existing Valkey or Redis server,
#                                       no broker container
#   docker-compose.proxy.yml            behind a TLS reverse proxy on the same host:
#                                       loopback-only port, secure cookies
#
# Production is all four overrides together:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.external-db.yml:docker-compose.external-broker.yml:docker-compose.proxy.yml
#
# The broker container runs Valkey unless BROKER_IMAGE in .env says otherwise;
# BROKER_IMAGE=redis:7-alpine runs Redis instead. It requires BROKER_PASSWORD,
# which `make up` generates.
#
# The application source lives in its own repository. ARKS_SRC (see .env)
# points at that checkout and it is wired in below as the named build context
# `src`; the Dockerfile takes what it needs from there. `make up` writes
# ARKS_SRC into .env and clones the checkout if it is missing, so the fallback
# below only matters for tearing down a stack whose .env is gone.
#
# The project is named explicitly so renaming either checkout does not orphan
# the volumes.
name: arkservice

# Every service logs through Docker's json-file driver, capped at five 10 MB
# files, so a chatty container cannot fill the disk. `make logs` still works.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # Applied the one time the container initialises its volume: changing
    # them later needs `make clean` first. See .env.example.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ark}
      POSTGRES_USER: ${POSTGRES_USER:-ark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ark}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      retries: 10
    # Not published: the database is reachable from the other containers by
    # name. Uncomment only if you need a client on the host, and set
    # POSTGRES_PASSWORD in .env to something of your own if you do.
    # ports: ["5432:5432"]

  # Broker and cache: the Celery queues for bulk binds and the periodic tasks,
  # plus the shared cache. Valkey by default; BROKER_IMAGE in .env picks
  # another Redis-protocol server, such as redis:7-alpine. The application is
  # the same either way: it talks the Redis protocol, so its URLs below keep
  # the redis:// scheme while the host is this service.
  #
  # Clients must authenticate with BROKER_PASSWORD (the server's default
  # user). Both images pass arguments that start with - to their server, so
  # one command line serves either. A blank password turns authentication
  # off, which only makes sense on a machine nobody else can reach.
  #
  # It keeps its data in the brokerdata volume, appending every write to a log
  # flushed once a second, so a restart loses neither queued bulk-bind jobs nor
  # redirect counts not yet written to the database. noeviction because the
  # queue and the counters share this server with the cache: under memory
  # pressure a write must fail loudly rather than silently drop a queued job or
  # a count. Never give it an allkeys-* policy.
  #
  # The healthcheck calls redis-cli, which the Valkey image also provides (as a
  # link to valkey-cli), so it holds for both. It looks for PONG rather than
  # trusting the exit status: redis-cli exits 0 even when authentication fails,
  # which would report a misconfigured broker healthy.
  broker:
    image: ${BROKER_IMAGE:-valkey/valkey:8-alpine}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BROKER_MEM_LIMIT:-256m}
    command:
      - --requirepass
      - "${BROKER_PASSWORD:-}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      # Below BROKER_MEM_LIMIT, so a full broker refuses writes (hits are then
      # written straight to the database) instead of being killed by Docker.
      - --maxmemory
      - ${BROKER_MAXMEMORY:-200mb}
    environment:
      BROKER_PASSWORD: ${BROKER_PASSWORD:-}
    volumes: [brokerdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$BROKER_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$BROKER_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 15s
      retries: 10

  web:
    image: arkservice-web:local
    build:
      context: .
      additional_contexts:
        src: ${ARKS_SRC:-../arks-service}
        # Optional plugin checkout (arks-cli); plugins-none/ installs nothing.
        plugin: ${ARKS_PLUGIN_SRC:-./plugins-none}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    # Threads rather than more processes: a /manifest fetch parks a worker on
    # I/O, and 3 sync workers meant three slow targets could stall the whole
    # service. Each worker is replaced after about 2000 requests (jittered so
    # they do not all restart together), which caps slow memory growth.
    # --keep-alive 5 sits above a proxy's pooled-connection ttl, so the proxy
    # always closes an idle connection first. This is the only place the
    # command is set: the image has no CMD of its own.
    command: >
      sh -c "python manage.py migrate --no-input &&
             exec gunicorn arkservice.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 8 --worker-class gthread --timeout 60 --graceful-timeout 30 --keep-alive 5 --max-requests 2000 --max-requests-jitter 200 --access-logfile -"
    # Above gunicorn's 30 s graceful timeout, so in-flight requests finish
    # before Docker sends SIGKILL.
    stop_grace_period: 35s
    environment: &env
      DATABASE_URL: postgres://${POSTGRES_USER:-ark}:${POSTGRES_PASSWORD:-ark}@db:5432/${POSTGRES_DB:-ark}
      # Database 0 is the Celery queue, database 1 the cache. The password goes
      # in only when there is one.
      CELERY_BROKER_URL: redis://${BROKER_PASSWORD:+:$BROKER_PASSWORD@}broker:6379/0
      REDIS_URL: redis://${BROKER_PASSWORD:+:$BROKER_PASSWORD@}broker:6379/1
      # No default: bringing the stack up should fail loudly rather than run
      # with session cookies anyone can forge. `make up` generates one.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?run `make up` (or `make env`) to generate one in .env}
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      # localhost is always present because the container healthcheck curls it,
      # and Django answers 400 for a host it does not recognise. Replacing the
      # whole list would leave the stack permanently unhealthy, so operators add
      # to it through ARKS_EXTRA_HOSTS instead of overwriting it.
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1${ARKS_EXTRA_HOSTS:+,$ARKS_EXTRA_HOSTS}"
      # Plain HTTP on a workstation. docker-compose.proxy.yml turns both on for
      # a stack behind TLS.
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      MEDIA_ROOT: /data/media
      # Everything below is passed through from .env, documented in README.md.
      # A blank default leaves the application's own default in force; the
      # rest are numbers or booleans, which the application cannot read from a
      # blank value, so their defaults are spelled out and match the
      # application's except where a comment says otherwise.
      #
      # Behind a proxy: comma-separated https:// origins, only needed when a
      # form is posted from a different hostname than the one serving it.
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      # Off here because this file publishes gunicorn's port to the network
      # directly, where X-Forwarded-For is whatever the client says.
      # docker-compose.proxy.yml defaults it to true, because Apache appends
      # the real client address and nothing else can reach the port.
      TRUST_FORWARDED_FOR: "${TRUST_FORWARDED_FOR:-false}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
      ARK_PUBLIC_BASE_URL: "${ARK_PUBLIC_BASE_URL:-}"
      DB_CONN_MAX_AGE: "${DB_CONN_MAX_AGE:-60}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5}"
      DB_READ_TIMEOUT: "${DB_READ_TIMEOUT:-60}"
      DB_WRITE_TIMEOUT: "${DB_WRITE_TIMEOUT:-60}"
      CACHE_SOCKET_TIMEOUT: "${CACHE_SOCKET_TIMEOUT:-0.5}"
      # Shared with the worker through the anchor on purpose: the two must
      # agree on the caps. 0 removes the mint cap.
      MINT_MAX_PER_REQUEST: "${MINT_MAX_PER_REQUEST:-10000}"
      # Optional plugins built into the image (ARKS_PLUGIN_SRC), e.g. arks_cli.
      # Naming one that is not installed stops the service with a clear error.
      ARKS_PLUGINS: "${ARKS_PLUGINS:-}"
      BULK_BIND_MAX_ROWS: "${BULK_BIND_MAX_ROWS:-100000}"
      BULK_BIND_MAX_BYTES: "${BULK_BIND_MAX_BYTES:-52428800}"
      BULK_BIND_RETENTION_DAYS: "${BULK_BIND_RETENTION_DAYS:-0}"
      CELERY_TASK_TIME_LIMIT: "${CELERY_TASK_TIME_LIMIT:-3600}"
      # Close to legacy's 30 s: on-demand manifests send nothing until built.
      MANIFEST_FETCH_TIMEOUT: "${MANIFEST_FETCH_TIMEOUT:-30}"
      MANIFEST_TOTAL_TIMEOUT: "${MANIFEST_TOTAL_TIMEOUT:-30}"
      MANIFEST_MAX_CONCURRENT: "${MANIFEST_MAX_CONCURRENT:-4}"
      COLLECTION_STATS_SECONDS: "${COLLECTION_STATS_SECONDS:-300}"
      SORT_SUBQUERY_MAX_ROWS: "${SORT_SUBQUERY_MAX_ROWS:-50000}"
      EXPORT_SYNC_MAX_ROWS: "${EXPORT_SYNC_MAX_ROWS:-100000}"
      # Set inside the container only when FALLBACK_DIR names a host directory;
      # the mount below always exists (the stack's own empty fallback/ when the
      # variable is blank), the variable decides whether the application looks.
      FALLBACK_PAGES_DIR: "${FALLBACK_DIR:+/data/fallback}"
    volumes:
      - media:/data/media
      - "${FALLBACK_DIR:-./fallback}:/data/fallback:ro"
    ports: ["${ARKS_PORT:-8000}:8000"]
    # /healthz proves the database and the counter cache are reachable, not
    # merely that gunicorn bound the port. `up --wait` blocks on this, so the
    # stack is only reported ready once migrations have run and it can serve.
    # 30 s of grace plus 10 failures 15 s apart: about three minutes, as
    # before, for a first start that has every migration to run.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_healthy}

  # Bulk-bind jobs, from the default `celery` queue. Two at a time; each child
  # process is replaced after 20 jobs or once it passes about 1 GB, so one huge
  # upload cannot leave the worker holding that memory for good. The long grace
  # period lets a job that is running finish before Docker kills it.
  worker:
    # No build section: the worker runs the same image web builds, so the
    # source is compiled into one image rather than two.
    image: arkservice-web:local
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    command: celery -A arkservice worker -Q celery --concurrency 2 --max-tasks-per-child 20 --max-memory-per-child 1000000 --loglevel=info
    stop_grace_period: 120s
    environment: *env
    volumes: [media:/data/media]
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_healthy}
      # web runs the migrations, so the worker waits for it rather than racing
      # a half-built schema on a first install.
      web: {condition: service_healthy}

  # Celery beat and the `periodic` queue it feeds: the redirect-counter flush
  # and the other housekeeping tasks. A process of its own so a long bulk bind
  # can never hold the flush up, and so the worker can be scaled without
  # running beat twice. Run exactly one.
  scheduler:
    image: arkservice-web:local
    restart: unless-stopped
    logging: *logging
    mem_limit: ${SCHEDULER_MEM_LIMIT:-256m}
    command: celery -A arkservice worker -Q periodic --pool solo --concurrency 1 --beat --loglevel=info
    stop_grace_period: 30s
    environment: *env
    volumes: [media:/data/media]
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_healthy}
      web: {condition: service_healthy}

volumes:
  pgdata:
  media:
  brokerdata:
